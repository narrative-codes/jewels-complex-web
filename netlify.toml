[build]
  command = "npm install && npm run build"
  publish = "client/dist"

[functions]
  directory = "netlify/functions"
  included_files = ["server/data/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200